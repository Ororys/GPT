name: Personal B2C prototype
on: [push, pull_request]
permissions:
  contents: read
jobs:
  personal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/personal
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hc_personal_ci
          POSTGRES_PASSWORD: synthetic-ci-owner-only
          POSTGRES_DB: postgres
        ports: ['55434:5432']
        options: >-
          --health-cmd "pg_isready -U hc_personal_ci"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      HC_TEST_ADMIN_URL: postgresql://hc_personal_ci:synthetic-ci-owner-only@127.0.0.1:55434/postgres
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/personal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run test:pg
      - run: npm run build
      - run: npm run test:storage-http
      - run: npm run test:backup
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:pg
      - run: npm run test:e2e:oidc
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-browser-evidence
          path: |
            apps/personal/test-results/
            apps/personal/playwright-report/
