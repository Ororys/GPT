name: Mobile apps (Android and iOS)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - run: npm test
  demo-mobile:
    # Private synthetic Sites demo (separate source): worker tests, types and build.
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: demo-mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: demo-mobile/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
  android:
    runs-on: ubuntu-latest
    needs: checks
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      # Launch mode: the screens are embedded in the app (no server), built from apps/personal.
      - run: npm ci && npm run build:mobile
        working-directory: apps/personal
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: convergence-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-latest
    needs: checks
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - run: npm ci && npm run build:mobile
        working-directory: apps/personal
      - run: npx cap sync ios
      # Simulator build without signing: proves the project compiles; no Apple account used.
      - run: >-
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/mobile/ios/App
